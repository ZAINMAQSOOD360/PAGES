<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Profile Card</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="profile-card">
        <div class="image">
            <img src="https://via.placeholder.com/150" alt="Profile Picture" class="profile-img">
        </div>

        <div class="text-data">
            <span class="name">Coding Lab</span>
            <span class="job">Full Stack Developer</span>
        </div>

        <div class="media-buttons">
            <a href="#" style="background: #4267B2" class="link"><i class="fab fa-facebook-f"></i></a>
            <a href="#" style="background: #1DA1F2" class="link"><i class="fab fa-twitter"></i></a>
            <a href="#" style="background: #E1306C" class="link"><i class="fab fa-instagram"></i></a>
            <a href="#" style="background: #ff0000" class="link"><i class="fab fa-youtube"></i></a>
        </div>

        <div class="buttons">
            <button class="button">Subscribe</button>
            <button class="button">Message</button>
        </div>

        <div class="analytics">
            <div class="data">
                <i class="far fa-heart"></i>
                <span class="number">20k</span>
            </div>
            <div class="data">
                <i class="far fa-comment"></i>
                <span class="number">10k</span>
            </div>
            <div class="data">
                <i class="fas fa-share"></i>
                <span class="number">12k</span>
            </div>
        </div>
    </div>

</body>
</html>
